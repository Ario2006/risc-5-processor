# ABOUTME: CI: lint the Python tools and run every test (assembler, ISS and all RTL simulations).
# ABOUTME: Synthesis is not run here; it is slow and its numbers live in results/.
name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: sudo apt-get update && sudo apt-get install -y iverilog
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -q
