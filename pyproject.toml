[project]
name = "rvpipe"
version = "0.1.0"
description = "Tools for the 5-stage pipelined RISC-V project: assembler, reference model, runners"
requires-python = ">=3.11,<3.15"
dependencies = [
    "matplotlib>=3.9",
    "yowasp-yosys>=0.50",
    "yowasp-nextpnr-ecp5>=0.11",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
